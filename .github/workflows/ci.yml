name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Start React app
        run: |
          echo "PORT=3001" >> $GITHUB_ENV
          npm start &
        env:
          CI: true

      - name: Wait for React app to be ready
        run: npx wait-on http://localhost:3001

      - name: Run Cypress tests
        run: npx cypress run

      - name: Stop React app
        run: pkill -f "react-scripts start" || true
